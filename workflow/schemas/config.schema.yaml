$schema: "http://json-schema.org/draft-06/schema#"
description: "Configuration schema for GeneProgramsProfiler"

# Global settings
type: object
properties:
  scRNAseq:
    type: string
  celltype_conversion_dictionary:
    type: string
    description: "Path to json dictionary to match celltype in the dataset to celltypes in cytopus"
  analysis_name:
    type: string
  queues:
    type: object
    properties:
      cpu:
        type: string
      gpu:
        type: string

  # Module 1: preprocess.smk
  preprocess:
    type: object
    properties:
      # Rule 1: annotate_and_save
      annotate_and_save:
        type: object
        properties:
          celltype_annotation_colname:
            type: string
            description: "Name of celltype annotation column in the seurat object's metadata"
          cores:
            types: integer
          rstudio_memory:
            type: integer
            description: "Memory occupied by loading the scRNAseq dataset on R"
          time:
            type: string
            description: "Job walltime, if required by computing infrastructure."
            pattern: "^[0-9]+:[0-5][0-9]:[0-5][0-9]$"
        required:
          - cores
          - celltype_annotation_colname
          - rstudio_memory
  # Module 2: spectra.smk
  spectra:
    type: object
    properties:
      # Rule 1: prepare_cytopus_list
      prepare_cytopus_list:
        type: object
        properties:
          mem_mb:
            type: integer
            description: "Memory required to donwload and save the required cytopus gene sets"
          cores:
            type: integer
          global_celltype:
            type: string
            description: "cell type to use as global celltype in the cytopus list. For more details visit https://github.com/wallet-maker/cytopus"
          time:
            type: string
            description: "Job walltime, if required by computing infrastructure."
            pattern: "^[0-9]+:[0-5][0-9]:[0-5][0-9]$"
        required:
          - mem_mb
          - cores
      # Rule 2: run_spectra
      run_spectra:
        type: object
        properties:
          lambda:
            type: number
            max: 0.5
            min: 0.0001
            description: weighs relative contribution of cytopus list and expression loss functions. For more details visit https://github.com/dpeerlab/spectra
          cores:
            type: integer
          mem_mb:
            type: integer
          time:
            type: string
            description: "Job walltime, if required by computing infrastructure."
            pattern: "^[0-9]+:[0-5][0-9]:[0-5][0-9]$"
        required:
          - lambda
          - cores
          - mem_mb

required:
  - scRNAseq
  - celltype_conversion_dictionary
  - analysis_name
